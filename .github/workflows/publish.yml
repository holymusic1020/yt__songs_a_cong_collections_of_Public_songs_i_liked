name: yt-auto · publish episode

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: "23 9 * * *"        # DAILY: a short every day; a full video every 3rd EP

# 🔒 one release at a time — kills the duplicate-EP race (manual spam-safe)
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write               # state.json commit keeps the repo active

jobs:
  publish:
    runs-on: ubuntu-latest      # ffmpeg is preinstalled on this image
    timeout-minutes: 35         # Veo/GenAI polling headroom; usual run ~5 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🎬 Ensure ffmpeg (static build — never trust the image)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 🩺 Pre-flight doctor
        run: python tools/doctor.py

      - name: Compose + render + upload episode
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p out
          python -m src.main --publish 2>&1 | tee out/run.log

      - name: 📋 Release summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save run records (text only — media is wiped after upload)
        if: always()                    # also on failure — run.log helps debugging
        uses: actions/upload-artifact@v4
        with:
          name: episode-latest
          path: |
            out/latest.json
            out/summary.md
            out/run.log
          if-no-files-found: ignore     # never fail the job over a missing log
          retention-days: 14            # auto-expire — zero storage pile-up

      - name: 📣 Status alerts (Telegram / Discord — optional)
        if: always()                    # fires on success AND failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |                          # a dead alert step must never turn a good run red
          python -m src.notify \
            --status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --log out/run.log || echo "⚠️ notify glitched — the release itself is unaffected"

      - name: Commit state (self-healing on drift)
        if: always()                    # partial-failure runs must ALSO commit
        run: |                          # state, or tomorrow re-uploads a duplicate
          git config user.name "yt-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          (git add state/state.json out/latest.json 2>/dev/null || git add state/ 2>/dev/null || true)
          git commit -m "ep: publish run $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || echo "nothing to push"
