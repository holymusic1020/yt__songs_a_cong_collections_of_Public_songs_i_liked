name: yt-auto · publish episode

on:
  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      run_mode:
        description: "dry_run = test only (NO YouTube upload) | publish = real release"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - publish
      multipost_override:
        description: "optional dry-run lane list, e.g. fb,tt (secret/vars used when blank)"
        required: false
        default: ""
      multipost_dryrun:
        description: "1 = multipost lanes RENDER-ONLY, no API calls (whole-process dry run)"
        required: false
        default: ""
  schedule:
    - cron: "23 9 * * *"        # DAILY: a short every day; a full video every 3rd EP

# 🔒 one release at a time — kills the duplicate-EP race (manual spam-safe)
concurrency:
  group: publish
  # 🚨 2026-08-19: was 'false' → 2 runs for the same EP.015 fired close
  # together, both read stale state (episode=14) and BOTH uploaded a
  # short = duplicate post (spam signal). Newer run now CANCELS the
  # older one, so only ONE release per window ever happens.
  cancel-in-progress: true

permissions:
  contents: write               # state.json commit keeps the repo active
  # (no 'workflows' key — invalid scope; self-upgrade zips carry NO
  #  workflow files, so plain contents:write is always enough)

jobs:
  publish:
    runs-on: ubuntu-latest      # ffmpeg: brought in by our own step below
    timeout-minutes: 180        # v23.6: MusicGen-local CPU lane needs headroom (install+download+gen ~40 min)
    steps:
      - uses: actions/checkout@v4

      - name: 🤖 Self-upgrade insurance (eat any pending mail-slot zips)
        run: |                  # belt & suspenders for upgrades/ — works even
          set -e                # if upgrade.yml is skipped/deleted someday
          shopt -s nullglob
          zips=(upgrades/*.zip)
          [ ${#zips[@]} -eq 0 ] && { echo "no upgrades pending"; exit 0; }
          for z in "${zips[@]}"; do
            echo "📦 applying $z"
            tmp=$(mktemp -d)
            unzip -oq "$z" -d "$tmp"
            rsync -a --exclude ".git/" --exclude ".github/" --exclude "upgrades/" "$tmp"/ .
            rm -rf "$tmp" "$z"
          done
          git config user.name "nix-bot"
          git config user.email "nix-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "🤖 self-upgrade (publish-run)" && git push
          }
          echo "upgrade applied — the REST of this run already uses the new code"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🎬 Ensure ffmpeg (multi-source, drawtext)
        run: |
          # 2026-08-13 fix: johnvansickle.com was unreachable and killed the
          # whole run. Try THREE sources: apt (has drawtext) → GitHub BtbN
          # static (never down) → old static site. Fail only if ALL fail.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg present: $(ffmpeg -version | head -1)"
          else
            echo "no ffmpeg — trying apt (has drawtext)…"
            if ! (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || ! command -v ffmpeg >/dev/null 2>&1; then
              echo "apt failed — trying GitHub BtbN static build…"
              curl -fsSL -o /tmp/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
              tar -xJf /tmp/ff.tar.xz -C /tmp
              FF=$(echo /tmp/ffmpeg-master-latest-linux64-gpl)
              sudo install -m 755 "$FF/bin/ffmpeg" "$FF/bin/ffprobe" /usr/local/bin/
            fi
            command -v ffmpeg >/dev/null 2>&1 || { echo "❌ ALL ffmpeg sources failed"; exit 1; }
          fi
          ffmpeg -version | head -1
          echo "drawtext filters: $(ffmpeg -hide_banner -filters 2>/dev/null | grep -c drawtext)"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 🎁 Fetch queued song (cooked by the previous run)
        id: queue
        run: |
          PREV=$(gh run list --workflow publish.yml --limit 6 \
                 --json databaseId,status --jq \
                 '[.[] | select(.databaseId != ${{ github.run_id }} and .status=="completed")][0].databaseId // empty')
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          [ -n "$PREV" ] || { echo "no previous run — nothing queued yet"; exit 0; }
          mkdir -p incoming
          gh run download "$PREV" -n next-song -D incoming || echo "queue empty — engine will compose today"
          # 🧟 zombie kill (2026-08-29): the stale DiffRhythm corpse that kept
          # re-serving itself through this hand-off for days is poison by name:
          rm -f incoming/next_song--drift_phonk--en.* || true
          ls -la incoming/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🩺 Pre-flight doctor
        run: python tools/doctor.py

      - name: Compose + render + upload episode
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # 🎤 VOCALS-EVERYWHERE pack (2026-08-26)
          REQUIRE_VOCALS: "1"            # never publish an instrumental again — refuse instead
          VOCAL_EVERYDAY: "1"    # TEMP until ace-kaggle lane ear-approved (boss 2026-08-26: then flip 0 = vocals on video days only)
          KAGGLE_FIRST: "0"   # 0 = ACE-Step v1.5 auditions BEFORE kaggle (quality war); kaggle = backup
          COOK_TODAY_IF_QUEUE_EMPTY: "1" # no queued song? cook a vocal one live
          KAGGLE_MAX_WAIT_S: "3600"      # HQ 56-step cooks run longer; do not give up early
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}               # free-space vocal GPU quota ⭐
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}   # 🎵 free-GPU vocal lane (no card)
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }} # NEW kaggle token (settings → API)
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}             # legacy kaggle.json key (optional)
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}       # premium studio slot 🍳 (optional)
          SUNO_MODEL: ${{ vars.SUNO_MODEL }}              # default V4_5ALL
          SUNO_OFF: ${{ vars.SUNO_OFF }}                  # 1 = skip suno slot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # community post packs 📮
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORLD_TOUR_EVERY: ${{ vars.WORLD_TOUR_EVERY }}  # 🌍 dials (optional)
          WORLD_LANGS: ${{ vars.WORLD_LANGS }}
          POSTS_OFF: ${{ vars.POSTS_OFF }}                # 1 = silence post packs
          # 🌐 MULTIPOST keys (2026-09-02 boss onboarding FB): reads from Secrets OR Variables — boss added by hand;
          # without these lines main.py's multi_post.fanout() sees empty env and stays OFF forever.
          MULTIPOST: ${{ inputs.multipost_override || secrets.MULTIPOST || vars.MULTIPOST }}  # manual dry runs may override the lane list ("fb,tt")
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID }}           # page number (1294240837106632 = Nix Speech Graph id; profile-link id ≠ graph id — proof diagnosed)
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN || vars.FB_PAGE_TOKEN }}  # EAA page token
          PUBLISH_OFF: ${{ vars.PUBLISH_OFF }}                               # 🛑 MASTER SWITCH — 1 demotes cron runs to dry-run (YT+FB both parked; boss interlude 2026-09-02)
          MULTIPOST_DRYRUN: ${{ inputs.multipost_dryrun || vars.MULTIPOST_DRYRUN }}  # 🧪 1 = lanes render-only, zero API calls
        run: |
          set -o pipefail
          mkdir -p out
          # SAFE RUN CONTROL: cron always publishes (real release).
          # Manual runs honour the run_mode input:
          #   · dry_run → --dry-run (compose + render, NO YouTube upload, NO state change)
          #   · publish → --publish  (real release, keep-alive-gated in main.py)
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [ "${PUBLISH_OFF:-0}" = "1" ]; then
              RUN_ARGS="--dry-run"
              echo "🛑 PUBLISH_OFF=1 — master switch: cron demoted to a harmless dry-run (YT+FB parked; boss interlude 2026-09-02)"
            else
              RUN_ARGS="--publish"
            fi
          elif [[ "${{ inputs.run_mode }}" == "publish" ]]; then
            RUN_ARGS="--publish"
          else
            RUN_ARGS="--dry-run"
          fi
          echo "RUN_ARGS=${RUN_ARGS} (event=${{ github.event_name }})"
          python -m src.main $RUN_ARGS 2>&1 | tee out/run.log

      - name: 📋 Release summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save run records (text only — media is wiped after upload)
        if: always()                    # also on failure — run.log helps debugging
        uses: actions/upload-artifact@v4
        with:
          name: episode-latest
          path: |
            out/latest.json
            out/summary.md
            out/run.log
            out/post_card.png
          if-no-files-found: ignore     # never fail the job over a missing log
          retention-days: 14            # auto-expire — zero storage pile-up

      - name: 📦 Queue tomorrow's song (artifact hand-off)
        if: always()                    # queue refreshes its 14-day TTL every run
        continue-on-error: true         # queue miss must never redden a run
        uses: actions/upload-artifact@v4
        with:
          name: next-song
          path: incoming/next_song*.*
          if-no-files-found: ignore     # no song cooked today? tomorrow asks live
          retention-days: 14

      - name: 📣 Status alerts (Telegram / Discord — optional)
        if: always()                    # fires on success AND failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |                          # a dead alert step must never turn a good run red
          python -m src.notify \
            --status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --log out/run.log || echo "⚠️ notify glitched — the release itself is unaffected"

      - name: Commit state (self-healing on drift)
        if: always()                    # partial-failure runs must ALSO commit
        run: |                          # state, or tomorrow re-uploads a duplicate
          git config user.name "yt-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json out/latest.json 2>/dev/null || true
          # 🧱 audio NEVER rides the state commit (2026-08-29 hydra fix):
          [ -d incoming ] && git add 'incoming/*.txt' 'incoming/*.md' 'incoming/*.json' 2>/dev/null || true
          git rm -q -r --cached --ignore-unmatch incoming/*.mp3 incoming/*.wav incoming/*.m4a incoming/*.flac incoming/*.ogg 2>/dev/null || true
          git commit -m "ep: publish run $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || echo "nothing to push"
