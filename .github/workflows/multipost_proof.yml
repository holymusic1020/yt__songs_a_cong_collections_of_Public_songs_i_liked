name: 🧪 multipost proof (fb reel)

on:
  workflow_dispatch:          # manual-only by design — never fires on cron
    inputs:
      rescue_url:
        description: "optional: re-post THIS YouTube short as a FB reel (rescue mode)"
        required: false
        default: ""
      rescue_title:
        description: "rescue reel caption title (optional when rescue_url set)"
        required: false
        default: ""
      rescue_yt:
        description: "real YouTube link for the caption (when rescue_url is a raw/vault mp4)"
        required: false
        default: ""
      rescue_caption:
        description: "FULL caption override (wins over title+link builder)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  proof:
    name: 🧪 fire proof reel to FB Page
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: ffmpeg present?
        run: |
          which ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg 2>&1 | tail -2; }
          ffmpeg -version 2>/dev/null | head -1

      - name: 🩹 python + zero deps (stdlib proof)
        run: python3 --version

      - name: 🚀 render + post proof reel
        env:
          MULTIPOST: ${{ secrets.MULTIPOST || vars.MULTIPOST }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN || vars.FB_PAGE_TOKEN }}
          RESCUE_URL: ${{ inputs.rescue_url }}          # set → rescue mode (collect a missed reel)
          RESCUE_TITLE: ${{ inputs.rescue_title }}
          RESCUE_YT: ${{ inputs.rescue_yt }}            # caption's real yt link when url is vault/raw
          RESCUE_CAPTION: ${{ inputs.rescue_caption }}  # full override
        run: python3 tools/fb_proof.py
