name: 🔗 tiktok linker (one-shot)

# WHAT THIS IS (boss): the bridge that turns your ONE authorize code into the
# repo's TIKTOK_ACCESS_TOKEN + TIKTOK_REFRESH_TOKEN secrets. After that the
# 24h rotation machine (multi_post.tiktok_video, persist-fixed 2026-09-03)
# keeps them alive forever.
# HOW TO RUN: Actions tab → "🔗 tiktok linker" → Run workflow → paste the
# WHOLE redirect address (the one with ?code= in it) → Run. Self-verifies and
# prints TT_SECRET_OK=1 when secrets are live.
# fire_draft=true (default; bot use): after linking, ALSO push today's vaulted
# short (bossdrop-stage/ep030_short.mp4) into the boss's TikTok as a SELF_ONLY
# draft — the one-tap-publish inbox proof.
# v4 (2026-09-03): TTL race won (boss 2-sec fire, attempt-1 token OK) but
# gh secret set auth-died (exit 4 — repo GH_TOKEN secret missing/weak; the
# old rotation HEAD-stub had silently swallowed that for months). FIX ORDER:
# encrypted HANDOFF to the bot's RSA pubkey echoes FIRST (ciphertext-only in
# logs — bot-only-decodable) → gh secret set best-effort → draft still fires.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "paste the WHOLE redirect address OR just the code string"
        required: true
        default: ""
      fire_draft:
        description: "true = also fire the SELF_ONLY draft proof after linking"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  link:
    name: exchange code → tokens → repo secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # first: carries tools/tt_handoff_pubkey.pem for the handoff

      - name: exchange + handoff + persist + verify
        env:
          TT_CODE: ${{ inputs.code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          REDIRECT_URI: https://www.youtube.com/channel/UCRoOiKBNbFedb183Rj2l8zg
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # accept either the full redirect URL or the bare code
          CODE=$(python3 <<'PY'
          import os, re
          from urllib.parse import unquote
          raw = os.environ["TT_CODE"].strip().replace("&amp;", "&")
          m = re.search(r"[?&]code=([^&\s)\]]+)", raw)
          if m:
              print(unquote(m.group(1)))
          elif re.fullmatch(r"[A-Za-z0-9\-._~%!*]+", raw):
              print(unquote(raw))
          PY
          )
          [ -n "$CODE" ] || { echo "❌ no code found in input"; exit 1; }
          echo "code captured (${#CODE} chars) — exchanging (TTL race: up to 4 fast attempts)…"
          RESP=""
          for attempt in 1 2 3 4; do
            RESP=$(curl -sS -X POST "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "code=$CODE" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "redirect_uri=$REDIRECT_URI")
            case "$RESP" in *access_token*) echo "attempt $attempt: got token" ; break;; esac
            echo "attempt $attempt miss: $(printf '%s' "$RESP" | head -c 160)"
            sleep 4
          done
          RESP="$RESP" python3 <<'PY'
          import json, os, sys
          d = json.loads(os.environ["RESP"])
          if "access_token" not in d:
              print("❌ TT_EXCHANGE_FAILED:", d.get("error"), "|", d.get("error_description") or d.get("message") or d.get("log_id"))
              sys.exit(1)
          open("/tmp/at", "w").write(d["access_token"])
          open("/tmp/rt", "w").write(d["refresh_token"])
          open("/tmp/oid", "w").write(d.get("open_id", ""))
          print(f"✅ exchange OK | access ttl {d.get('expires_in')}s | refresh ttl {d.get('refresh_expires_in')}s | scope: {d.get('scope')}")
          PY
          # 🔐 HANDOFF FIRST (nothing below may eat the pair): AES-256 per-token
          # with one session key, RSA-4096-wrapped to the bot's pubkey. Logs
          # carry ciphertext only; the private key never leaves the bot sandbox.
          if openssl rand -base64 32 > /tmp/sessionkey_b64 && base64 -d /tmp/sessionkey_b64 > /tmp/sessionkey; then
            if openssl pkeyutl -encrypt -pubin -inkey tools/tt_handoff_pubkey.pem -in /tmp/sessionkey -out /tmp/kwrap 2>/dev/null; then
              for f in at rt oid; do
                [ -s /tmp/$f ] && openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/sessionkey -in "/tmp/$f" 2>/dev/null | base64 -w0 > "/tmp/$f.enc" || true
              done
              echo "HANDOFF_K=$(base64 -w0 /tmp/kwrap)"
              echo "HANDOFF_AT=$(cat /tmp/at.enc 2>/dev/null)"
              echo "HANDOFF_RT=$(cat /tmp/rt.enc 2>/dev/null)"
              echo "🔐 handoff sealed"
            else
              echo "(handoff wrap failed — continuing; secrets path must carry it)"
            fi
          fi
          # 🗃 persist to repo secrets — BEST EFFORT (GH_TOKEN secret may be missing/weak;
          #    handoff already guarantees the pair, and rotation self-heals later)
          for n in TIKTOK_ACCESS_TOKEN TIKTOK_REFRESH_TOKEN TIKTOK_OPEN_ID; do
            v=""
            case "$n" in
              TIKTOK_ACCESS_TOKEN)  v="$(cat /tmp/at)";;
              TIKTOK_REFRESH_TOKEN) v="$(cat /tmp/rt)";;
              TIKTOK_OPEN_ID)       v="$(cat /tmp/oid)";;
            esac
            [ -n "$v" ] || continue
            gh secret set "$n" -R "$REPO" --body "$v" \
              && echo "✅ $n written" \
              || echo "⚠️ $n write failed (gh auth) — handoff has it; rotation will re-persist when GH_TOKEN is solid"
          done
          curl -sS "https://open.tiktokapis.com/v2/user/info/?fields=open_id,display_name" \
            -H "Authorization: Bearer $(cat /tmp/at)" -o /tmp/ui.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/ui.json"))
          u = (d.get("data") or {}).get("user") or {}
          if u.get("open_id"):
              print("TT_SECRET_OK=1")
              print("connected as:", u.get("display_name"))
          else:
              print("⚠️ TT_USERINFO_FAIL:", json.dumps(d)[:300])
          PY

      - name: 🎬 fire first DRAFT into boss's TikTok (SELF_ONLY law)
        if: inputs.fire_draft == 'true'
        env:
          TIKTOK_REFRESH_TOKEN: ""     # 🚫 rotation OFF here: fresh minted pair → use directly,
          TIKTOK_CLIENT_KEY: ""        #    never consume the repo's refresh token outside cron
          TIKTOK_CLIENT_SECRET: ""
          DRAFT_URL: https://github.com/${{ github.repository }}/releases/download/bossdrop-stage/ep030_short.mp4
        run: |
          set -e
          curl -sSL "$DRAFT_URL" -o /tmp/draft.mp4
          ls -la /tmp/draft.mp4
          export TIKTOK_ACCESS_TOKEN="$(cat /tmp/at)"
          unset MULTIPOST_DRYRUN
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from src.multi_post import tiktok_video
          out = tiktok_video(Path("/tmp/draft.mp4"), "Nix Speech — EP.030 · first TT draft ✔ (one-tap publish)")
          print("TT_DRAFT_RESULT:", out)
          PY
